name: CUETools-only-net10
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Prepare third-party sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git apply --directory=ThirdParty/flac ThirdParty/submodule_flac_CUETools.patch --whitespace=nowarn
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Expand-Archive ThirdParty/MAC_SDK/MAC_1086_SDK.zip -DestinationPath ThirdParty/MAC_SDK/
          foreach ($entry in @(
            @('ThirdParty/MAC_SDK', 'ThirdParty/ThirdParty_MAC_SDK_CUETools.patch'),
            @('ThirdParty/taglib-sharp', 'ThirdParty/submodule_taglib-sharp_CUETools.patch'),
            @('ThirdParty/WavPack', 'ThirdParty/submodule_WavPack_CUETools.patch'),
            @('ThirdParty/WindowsMediaLib', 'ThirdParty/submodule_WindowsMediaLib_CUETools.patch'),
            @('ThirdParty/openclnet', 'ThirdParty/submodule_openclnet_net10.patch')
          )) {
            git apply --directory=$($entry[0]) $entry[1]
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Prepare reference FLAC encoder for integration tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force bin/tools | Out-Null
          Invoke-WebRequest 'https://github.com/xiph/flac/releases/download/1.5.0/flac-1.5.0-win.zip' -OutFile bin/tools/flac.zip
          if ((Get-FileHash bin/tools/flac.zip -Algorithm SHA256).Hash -ne '53F1500F0D6E7C61379D7FEE50D4A9F7F504C650009506D9BA015530D76C0DDE') { throw 'FLAC archive checksum mismatch' }
          Expand-Archive bin/tools/flac.zip -DestinationPath bin/tools/flac
          $encoder = Get-ChildItem bin/tools/flac -Recurse -Filter flac.exe | Where-Object FullName -match 'Win64' | Select-Object -First 1
          if (-not $encoder) { throw 'Missing x64 reference FLAC encoder' }
          "CUETOOLS_TEST_FLAC=$($encoder.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build and test x64 Release
        shell: pwsh
        run: ./build-net10.ps1 -Configuration Release
      - name: Publish applications
        shell: pwsh
        run: ./publish-net10.ps1 -Configuration Release -NoBuild -Experimental
      - name: Build Windows installer
        shell: pwsh
        run: ./build-installer.ps1 -Configuration Release -NoBuild -Experimental
      - uses: actions/upload-artifact@v4
        with:
          name: CUETools-Parallel-Preview-Setup-win-x64
          path: |
            bin/Release/installer/*-Setup.exe
            bin/Release/installer/*-Setup.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: CUETools-Parallel-Preview-win-x64
          path: bin/Release/cuetools-parallel-experimental/win-x64/CUETools/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: net10-test-results
          path: bin/TestResults/net10-Release/*.trx
